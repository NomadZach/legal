<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pinorama · Secure checkout</title>
<!--
  Pinorama hosted card form (LiteAPI User Payment flow).
  WHY THIS LIVES HERE: Supabase's gateway force-rewrites edge-function HTML to
  text/plain and injects a default-src 'none' CSP, so the payment page cannot be
  served from the native-checkout function. GitHub Pages is our static host.
  SECURITY: this page contains NO secrets. The per-transaction secretKey arrives
  as a runtime query param (Stripe-style client intent secret, safe client-side
  by design). returnUrl is HARD-ALLOWLISTED to the app's own scheme so this
  public page can never be abused as an open redirect.
-->
<!-- ========================================================================
  🔒 #1066 — ANTI-CLICKJACKING ON A HOST THAT CANNOT SET HEADERS.
  The in-function fallback page sets `X-Frame-Options: DENY`. THIS page is the
  one travelers actually load, and it is served by GitHub Pages, which permits
  NO custom response headers at all. Probed live 2026-08-25:
      x-frame-options ......... ABSENT
      content-security-policy . ABSENT
      x-content-type-options .. ABSENT
  So until this block, the real payment page was fully frameable while the page
  nobody loads was protected. That is #1066's actual gap.

  ⛔ WHY NOT A `<meta>` CSP: `frame-ancestors` is IGNORED when delivered in a
  meta tag — it is header-only, by spec. Adding one would look like protection
  in a diff and do nothing in a browser, which is worse than no line at all.
  `nosniff` is header-only too; GitHub Pages already serves this as
  `text/html; charset=utf-8`, so there is nothing to re-sniff.

  ✅ WHAT THIS DOES INSTEAD — hide first, reveal only when NOT framed. The
  ORDER is the security property, not a style choice:
    · framed, scripts allowed ....... reveal never runs, and we try to break
                                      out. Blank either way.
    · framed, `sandbox` with NO
      `allow-scripts` ............... our script never runs, so the style is
                                      never removed. Still blank. This is the
                                      case a naive `top.location = …` buster
                                      fails, and why the hiding must not depend
                                      on the navigation succeeding.
    · framed, scripts allowed but NO
      `allow-top-navigation` ........ the break-out throws, is caught, blank.
    · top-level (every real load) ... revealed immediately and without flicker,
                                      because this runs in <head> before paint.
  ⚖️ HONEST COST: with JavaScript disabled the page stays blank. It is already
  non-functional without JS — the card form is rendered by the LiteAPI SDK — so
  this trades a blank page for a blank page, never a working one.
======================================================================== -->
<style id="antiframe">html{display:none !important}</style>
<script>
  (function () {
    // FAIL CLOSED: unknown ⇒ treat as framed. ⚖️ The `catch` is what carries
    // that; the initializer is belt-and-braces and is REDUNDANT today (proved
    // by mutation — flipping it alone changes nothing, flipping the catch reds).
    // It is kept so that removing the catch cannot silently fail open.
    var framed = true;
    try { framed = (window.self !== window.top); } catch (e) { framed = true; }
    if (!framed) {
      var s = document.getElementById('antiframe');
      if (s && s.parentNode) s.parentNode.removeChild(s);
      return;                                // ⚠️ the ONLY path that reveals
    }
    try { window.top.location = window.self.location; } catch (e) { /* sandboxed */ }
  })();
</script>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:16px;background:#fff;color:#111}
  .badge{display:inline-block;background:#FFF4E0;color:#B76E00;border:1px solid #F0C070;
    border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
  #targetElement{margin-top:12px}
  .hint{color:#667;font-size:12px;margin-top:16px;line-height:1.5}
  .err{color:#a33;font-size:14px;margin-top:16px}
</style>
</head>
<body>
  <span class="badge" id="badge" style="display:none">SANDBOX · no real charge</span>
  <div id="targetElement"></div>
  <p class="hint" id="hint" style="display:none">Test card 4242 4242 4242 4242, any future expiry, any CVC.</p>
  <p class="err" id="err" style="display:none">Payment could not start — missing or invalid payment session. Please go back and try again.</p>
  <script src="https://payment-wrapper.liteapi.travel/dist/liteAPIPayment.js?v=a1"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var secretKey = q.get('secretKey') || '';
      var returnUrl = q.get('returnUrl') || '';
      var sandbox = q.get('sandbox') !== '0'; // default sandbox until production era
      var publicKey = sandbox ? 'sandbox' : (q.get('publicKey') || 'sandbox');

      // Validation mirrors the native-checkout fn: token-shaped secret, and the
      // returnUrl may ONLY be the app's own scheme (never http/https — this is a
      // public page and must not function as an open redirect).
      var tokenOk = /^[A-Za-z0-9_-]{10,200}$/.test(secretKey.replace(/[^A-Za-z0-9_-]/g, '')) && secretKey.length >= 10;
      var returnOk = /^nomadmap:\/\/[A-Za-z0-9\-._~/?#@!$&'()*+,;=%]*$/.test(returnUrl);
      if (!secretKey || !returnUrl || !tokenOk || !returnOk) {
        document.getElementById('err').style.display = 'block';
        return;
      }
      if (sandbox) {
        document.getElementById('badge').style.display = 'inline-block';
        document.getElementById('hint').style.display = 'block';
      }
      try {
        var cfg = {
          publicKey: publicKey,
          appearance: { theme: 'flat' },
          targetElement: '#targetElement',
          secretKey: secretKey,
          returnUrl: returnUrl
        };
        // VERIFIED 2026-07-18 against the LIVE SDK bundle (payment-wrapper
        // .liteapi.travel/dist/liteAPIPayment.js): the class exposes
        // handlePayment(), and publicKey 'sandbox' resolves via the SDK's
        // /config endpoint to LiteAPI's Stripe TEST publishable key
        // (provider stripe-test → Stripe.js loads and confirms the secretKey
        // payment intent). The go-live method-name question is CLOSED.
        var pay = new LiteAPIPayment(cfg);
        pay.handlePayment();
      } catch (e) {
        document.getElementById('targetElement').innerText =
          'Could not load the payment form. Please go back and try again.';
      }
    })();
  </script>
</body>
</html>
